{% extends "base.html" %}


{% block title %}
Edit User
{% endblock %}



{% block content %}



<form method="POST"
      enctype="multipart/form-data">



<div class="d-flex justify-content-between mb-4">


<div>

<h2>

<i class="fas fa-user-edit me-2"></i>

Edit User

</h2>


<p class="text-muted">

Update account and employment information.

</p>


</div>



<a href="{{ url_for('user.index') }}"
class="btn btn-secondary">


<i class="fas fa-arrow-left"></i>

Back


</a>


</div>





<!-- PERSONAL INFORMATION -->


<div class="card mb-4">


<div class="card-header">

<h3>
<i class="fas fa-id-card me-2"></i>

Personal Information

</h3>


</div>



<div class="card-body">


<div class="form-grid">



<div class="form-group">

<label>
Employee Number
</label>


<input
type="text"
name="employee_number"
class="form-control"
value="{{ user.employee_number }}"
readonly>


</div>





<div class="form-group">

<label>
Email
</label>


<input
type="email"
name="email"
class="form-control"
value="{{ user.email }}"
required>


</div>





<div class="form-group">

<label>
First Name
</label>


<input
type="text"
name="first_name"
class="form-control"
value="{{ user.first_name }}"
required>


</div>





<div class="form-group">

<label>
Middle Name
</label>


<input
type="text"
name="middle_name"
class="form-control"
value="{{ user.middle_name or '' }}">


</div>





<div class="form-group">

<label>
Last Name
</label>


<input
type="text"
name="last_name"
class="form-control"
value="{{ user.last_name }}"
required>


</div>





<div class="form-group">

<label>
Phone
</label>


<input
type="text"
name="phone"
class="form-control"
value="{{ user.phone or '' }}">


</div>



</div>

</div>

</div>







<!-- EMPLOYMENT -->



<div class="card mb-4">


<div class="card-header">

<h3>

<i class="fas fa-briefcase me-2"></i>

Employment Information

</h3>

</div>




<div class="card-body">


<div class="form-grid">



<div class="form-group">


<label>
Role
</label>


<select
name="role"
class="form-control">


{% for role in roles %}


<option
value="{{ role.value }}"
{% if user.role == role %}
selected
{% endif %}>


{{ role.value.replace("_"," ").title() }}


</option>


{% endfor %}


</select>


</div>





<div class="form-group">


<label>
Department
</label>


<select
name="department_id"
class="form-control">



<option value="">
Select Department
</option>


{% for department in departments %}


<option
value="{{ department.id }}"
{% if user.department_id == department.id %}
selected
{% endif %}>


{{ department.department_name }}


</option>


{% endfor %}



</select>


</div>






<div class="form-group">


<label>
Reporting Manager
</label>


<input
type="text"
class="form-control"
readonly
value="{{ user.manager.full_name if user.manager else 'Automatically Assigned' }}">


<small class="text-muted">

Controlled by department.

</small>


</div>



</div>


</div>


</div>








<!-- ACCOUNT -->



<div class="card mb-4">


<div class="card-header">


<h3>

<i class="fas fa-user-shield me-2"></i>

Account Settings

</h3>


</div>



<div class="card-body">


<div class="form-grid">



<div class="form-group">


<label>
Status
</label>


<select
name="status"
class="form-control">


{% for status in statuses %}


<option
value="{{ status.value }}"
{% if user.status == status %}
selected
{% endif %}>


{{ status.value.replace("_"," ").title() }}


</option>


{% endfor %}



</select>


</div>





<div class="form-group">

<label>
New Password
</label>


<input
type="password"
name="password"
class="form-control"
placeholder="Leave blank to keep current">


</div>






<div class="form-group">


<label>
First Login
</label>


<select
name="is_first_login"
class="form-control">


<option value="1"
{% if user.is_first_login %}
selected
{% endif %}>

Yes

</option>



<option value="0"
{% if not user.is_first_login %}
selected
{% endif %}>

No

</option>


</select>


</div>



</div>


</div>


</div>







<div class="card">


<div class="card-body d-flex justify-content-between">



<a href="{{ url_for('user.index') }}"
class="btn btn-secondary">

Cancel

</a>




<button type="submit"
class="btn btn-success">


<i class="fas fa-save"></i>

Update User


</button>



</div>


</div>



</form>



{% endblock %}
