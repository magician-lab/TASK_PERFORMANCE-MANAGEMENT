{% extends "base.html" %}



{% block title %}
Review Activity
{% endblock %}




{% block content %}



<div class="card">


<div class="card-header">

<h3>

{{ activity.title }}

</h3>

</div>




<div class="card-body">



<h5>
Employee Notes
</h5>


<p>

{{ activity.completion_notes or "No notes provided" }}

</p>



<hr>



<form method="POST">


<div class="form-group">


<label>

Verification

</label>


<select 
name="verification"
class="form-control">


<option value="VERIFIED">

Approve

</option>


<option value="REJECTED">

Reject

</option>


</select>


</div>




<br>



<div class="form-group">


<label>

Timeliness Rating

(1 - 5)

</label>


<select 
name="timeliness_rating"
class="form-control">


{% for i in range(1,6) %}

<option value="{{i}}">

{{i}}

</option>

{% endfor %}


</select>


</div>




<br>



<div class="form-group">


<label>

Quality / Perfection Rating

(1 - 5)

</label>


<select 
name="quality_rating"
class="form-control">


{% for i in range(1,6) %}

<option value="{{i}}">

{{i}}

</option>


{% endfor %}


</select>


</div>



<br>



<div class="form-group">


<label>

Manager Comments

</label>


<textarea

name="comments"

class="form-control"

rows="4">

</textarea>


</div>




<br>


<button class="btn btn-success">


<i class="fas fa-check"></i>

Submit Review


</button>



</form>



</div>


</div>



{% endblock %}
